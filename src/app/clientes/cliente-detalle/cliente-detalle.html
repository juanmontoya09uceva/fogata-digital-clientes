<div class="mb-3">
  <a routerLink="/clientes" class="btn btn-secondary btn-sm">
    &larr; Volver al listado
  </a>
</div>

<div class="card shadow-sm">
  <div class="card-header bg-primary text-white">
    <strong>Detalle del Cliente</strong>
  </div>
  <div class="card-body">

    <div class="d-flex align-items-center mb-4">
      @if (cliente().foto) {
        <img [src]="cliente().foto"
             [alt]="cliente().nombre"
             class="rounded-circle me-4"
             width="80" height="80">
      }
      <div>
        <h4 class="mb-0">{{ cliente().nombre }} {{ cliente().apellido }}</h4>
        <p class="text-muted mb-0">{{ cliente().email }}</p>
      </div>
    </div>

    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <strong>ID:</strong> {{ cliente().id }}
      </li>
      <li class="list-group-item">
        <strong>Región:</strong> {{ cliente().region?.nombre }}
      </li>
      <li class="list-group-item">
        <strong>Fecha de registro:</strong>
        {{ cliente().createAt | date:'dd/MM/yyyy' }}
      </li>
    </ul>

  </div>
  <div class="card-footer text-end">
    <button class="btn btn-danger btn-sm" (click)="deleteCliente()">
      Eliminar cliente
    </button>
  </div>
</div>
